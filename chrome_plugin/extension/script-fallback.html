<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>脚本下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            padding: 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            text-align: center;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4fc3f7;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 16px;
            color: #ccc;
        }

        .highlight {
            color: #81d4fa;
            font-weight: 500;
        }

        .code {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 16px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #ffd54f;
            margin: 20px 0;
            word-break: break-all;
        }

        .close-hint {
            margin-top: 24px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">📋</div>
        <h2>链接已复制到剪贴板</h2>
        <p>下载链接已经复制到你的剪贴板了。</p>
        <p>请打开 <span class="highlight">终端</span> 运行你的下载脚本：</p>
        <div class="code">python3 /Users/fucheng/托管脚本/通用文件下载器.py</div>
        <p>或者按 <span class="highlight">Cmd+V</span> 粘贴链接到其他下载工具。</p>
        <p class="close-hint">你可以关闭此页面</p>
    </div>
</body>

</html>
